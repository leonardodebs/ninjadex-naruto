name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilegio: o GITHUB_TOKEN so precisa ler o codigo para rodar o CI.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
